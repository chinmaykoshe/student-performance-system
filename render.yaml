services:
  # ── Node.js Express Backend ─────────────────────────────────
  - type: web
    name: predictedu-backend
    runtime: node
    rootDir: student-performance-system/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false          # You will set this in Render dashboard
      - key: JWT_SECRET
        sync: false          # Generate a secure secret
      - key: JWT_EXPIRE
        value: 30d
      - key: JWT_RESET_SECRET
        sync: false          # Generate a secure reset secret
      - key: ML_API_URL
        sync: false          # Set this to your live predictedu-mlapi Render URL after it deploys
      - key: CLIENT_URL
        sync: false          # Set to your Vercel frontend URL after deployment
      - key: GEMINI_API_KEY
        sync: false          # Set your Gemini API key from AI Studio
      - key: TOKEN_SESSION_LIMIT
        value: 8000
      - key: TOKEN_DAILY_USER
        value: 20000
      - key: TOKEN_DAILY_APP
        value: 80000

  # ── Python Flask ML API ──────────────────────────────────────
  - type: web
    name: predictedu-mlapi
    runtime: python
    rootDir: student-performance-system/ml-api
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PORT
        value: 8000
